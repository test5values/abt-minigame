<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五大信念猜字謎挑戰</title>
    <style>
        :root { --primary: #003a70; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            margin: 0; 
            padding: 10px 10px 50px 10px; 
            text-align: center; 
            background: skyblue; 
            touch-action: pan-y; 
            overflow-x: hidden; 
        }
        
        h1 {
            color: var(--primary);
            margin: 10px 0 15px 0;
            font-size: 6vw;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }
        @media (min-width: 480px) { h1 { font-size: 32px; } }

        #info-bar { background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #submit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #submit-btn:active { background: #218838; transform: translateY(2px); }

        #grid-container { 
            display: grid; 
            grid-template-columns: repeat(12, 1fr); 
            gap: 1px; 
            background: #ccc; 
            border: 2px solid var(--primary);
            margin: 0 auto;
            width: 90vw;
            max-width: 480px;
            user-select: none;
            touch-action: none;
        }
        .cell { 
            background: white; 
            aspect-ratio: 1;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 4vw;
        }
        @media (min-width: 480px) { .cell { font-size: 20px; } }
        .selected { background: #ffeb3b !important; }
        .found { background: #4caf50 !important; color: white; }
        
        #word-list { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 15px; padding: 10px; background: #fff; font-size: 13px; text-align: left; border-radius: 8px; }
        .word-found { text-decoration: line-through; color: #ccc; }

        #instruction-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px auto;
            width: 90vw;
            max-width: 480px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        #instruction-box h3 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
            border-bottom: 2px solid #f4f7f9;
            padding-bottom: 10px;
            font-size: 18px;
        }
        #instruction-box ul {
            padding-left: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <h1>香港仔隧道五大信念猜字謎挑戰</h1>

    <div id="info-bar">
        <strong>完成進度: <span id="count">0</span> / 15</strong><br>
        時間: <span id="timer">0</span> 秒<br>
        活動日期：2026年4月27日至5月8日
    </div>

    <button id="submit-btn" onclick="manualSubmit()">結束並提交成績</button>
    
    <div id="grid-container"></div>
    
    <p style="font-size:12px; color:#555; margin-top:5px;">(如需查看下方內容，請觸碰兩側空白處滑動)</p>

    <div id="instruction-box">
        <h3>📖 遊戲玩法</h3>
        <ul>
            <li>在字海中找出 <strong>5個</strong> 公司核心信念及 <strong>10個</strong> 核心信念相關成語其中 <strong>5個</strong>。</li>
            <li>手指（或滑鼠）<strong>橫向</strong> 或 <strong>直向</strong> 滑動連字。</li>
            <li>如有困難，可參考下方的詞語清單。</li>
            <li>完成挑戰後，按綠色按鈕提交成績。</li>
        </ul>
    </div>

    <div id="word-list"></div>

    <script>
        // ▼▼▼ Google_Script_function ▼▼▼
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0FpNFxYRXQXys69CcqZeLIKf_-Xkkup1VnxsF8QO-4VxgptolyBr_RXlijFJvXlm2/exec"; 
        // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

        const words = ["以客為尊", "創新與科技", "卓越服務", "團隊精神", "精益求精", "無微不至", "體貼入微", "推陳出新", "與時俱進", "一絲不苟", "貼心周到", "同舟共濟", "團結一心", "力求完美", "學無止境"];
        
        const gridRows = [
            "以客為尊步步高一絲不苟興",
            "萬事興創意無限好運來喜樂",
            "推陳出新歡天喜地笑口常開",
            "快樂團與時俱進恭喜發財旺",
            "幸福結科鴻運當頭百事可樂",
            "美體一技夢成真團隊精神棒",
            "愛貼心周到處處生機益多福",
            "學入平安喜樂順利力求完美",
            "無微不至錦上添花樂精無憂",
            "止氣東來同舟共濟年年有餘",
            "境隨心轉萬事勝意前程似錦",
            "心想事成福氣滿卓越服務讚",
            "好人一生平安龍馬精神大吉"
        ];

        let rawString = gridRows.join("");
        const gridArray = rawString.split("");
        
        const container = document.getElementById('grid-container');
        const foundWords = new Set();
        let seconds = 0;
        let gameEnded = false;

        gridArray.forEach((char, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = char;
            cell.setAttribute('data-index', i);
            container.appendChild(cell);
        });

        const listContainer = document.getElementById('word-list');
        words.forEach(w => {
            const div = document.createElement('div');
            div.id = 'word-' + w;
            div.innerText = "• " + w;
            listContainer.appendChild(div);
        });

        let timerRunning = true;
        const timerObj = setInterval(() => {
            if(timerRunning && !gameEnded) {
                seconds++;
                document.getElementById('timer').innerText = seconds;
            }
        }, 1000);

        let isSelecting = false;
        let startIdx = -1;
        let selectedIndices = [];

        function handleStart(e) {
            if(gameEnded) return;
            const t = e.touches ? e.touches[0] : e;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            
            if (el && el.classList.contains('cell')) {
                if(e.cancelable && e.type === 'touchstart') e.preventDefault();
                isSelecting = true;
                startIdx = parseInt(el.getAttribute('data-index'));
                selectedIndices = [startIdx];
                el.classList.add('selected');
            }
        }

        function handleMove(e) {
            if (!isSelecting || gameEnded) return;
            if(e.cancelable) e.preventDefault();

            const t = e.touches ? e.touches[0] : e;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            
            if (el && el.classList.contains('cell')) {
                const currentIdx = parseInt(el.getAttribute('data-index'));
                const sR = Math.floor(startIdx / 12), sC = startIdx % 12;
                const cR = Math.floor(currentIdx / 12), cC = currentIdx % 12;

                document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                selectedIndices = [];

                if (sR === cR) { // 橫
                    for (let c = Math.min(sC, cC); c <= Math.max(sC, cC); c++) {
                        const idx = sR * 12 + c;
                        selectedIndices.push(idx);
                        container.children[idx].classList.add('selected');
                    }
                } else if (sC === cC) { // 直
                    for (let r = Math.min(sR, cR); r <= Math.max(sR, cR); r++) {
                        const idx = r * 12 + sC;
                        selectedIndices.push(idx);
                        container.children[idx].classList.add('selected');
                    }
                }
            }
        }

        function handleEnd() {
            if (!isSelecting || gameEnded) return;
            isSelecting = false;
            const str = selectedIndices.map(i => gridArray[i]).join("");
            const rev = str.split("").reverse().join("");
            let f = words.includes(str) ? str : (words.includes(rev) ? rev : "");

            if (f && !foundWords.has(f)) {
                foundWords.add(f);
                selectedIndices.forEach(i => container.children[i].classList.add('found'));
                document.getElementById('word-' + f).className = 'word-found';
                document.getElementById('count').innerText = foundWords.size;
                
                if (foundWords.size === words.length) {
                    timerRunning = false; 
                }
            }
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        }

        async function manualSubmit() {
            if(gameEnded) return alert("你已經提交過成績了！");
            
            timerRunning = false;
            
            // ▼▼▼  ▼▼▼
            let confirmMsg = "你目前找到了 " + foundWords.size + " / 15 個答案。\n所用時間：" + seconds + " 秒。\n確定要現在提交嗎？";
            
            if(!confirm(confirmMsg)) {
                timerRunning = true;
                return;
            }

            gameEnded = true;

            if(GOOGLE_SCRIPT_URL.includes("http")) {
                const userName = prompt("請輸入您的姓名：");
                const empId = prompt("請輸入您的員工編號：");
                
                // record answer function
                const foundListString = Array.from(foundWords).join("、");

                if(userName) {
                    document.getElementById('submit-btn').innerText = "正在上傳...";
                    document.getElementById('submit-btn').disabled = true;

                    try {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: userName,
                                empId: empId,
                                score: foundWords.size + " / 15",
                                seconds: seconds,
                                foundList: foundListString
                            })
                        });
                        alert("✅ 成績已成功上傳！感謝參與！");
                        document.getElementById('submit-btn').innerText = "上傳成功";
                    } catch (error) {
                        alert("⚠️ 上傳失敗，請截圖給負責人。\n分數: " + foundWords.size + "\n時間: " + seconds);
                        gameEnded = false;
                    }
                } else {
                    gameEnded = false;
                    alert("您取消了輸入，請重新按提交。");
                }
            } else {
                alert("恭喜完成！(尚未設定後台網址)");
            }
        }

        container.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleEnd);
        
        container.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
    </script>
</body>
</html>
